<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="350" viewBox="0 0 1280 350" role="img" aria-labelledby="t">
<title id="t">frameproof: frame-level performance evidence for web apps, built for coding agents</title>
<style>
svg { --card:#f6f8fa; --card2:#ffffff; --ink:#1f2328; --muted:#59636e; --faint:#818b98; --line:#d1d9e0;
  --good:#1a7f37; --goodsoft:#dafbe1; --bad:#cf222e; --badsoft:#ffebe9; --accent:#8250df; --accentsoft:#fbefff;
  --warn:#9a6700; --warnsoft:#fff8c5; --blue:#0969da; --bluesoft:#ddf4ff; }
@media (prefers-color-scheme: dark) { svg { --card:#151b23; --card2:#0d1117; --ink:#f0f6fc; --muted:#9198a1; --faint:#656c76;
  --line:#3d444d; --good:#3fb950; --goodsoft:#12261e; --bad:#f85149; --badsoft:#2d1418; --accent:#ab7df8; --accentsoft:#231631;
  --warn:#d29922; --warnsoft:#272115; --blue:#4493f8; --bluesoft:#121d2f; } }
.card { fill: var(--card); stroke: var(--line); }
.card2 { fill: var(--card2); stroke: var(--line); }
.ink { fill: var(--ink); } .muted { fill: var(--muted); } .faint { fill: var(--faint); }
.good { fill: var(--good); } .bad { fill: var(--bad); } .accent { fill: var(--accent); } .warn { fill: var(--warn); } .blue { fill: var(--blue); }
.goodsoft { fill: var(--goodsoft); } .ontime { fill: var(--good); opacity: 0.22; } .badsoft { fill: var(--badsoft); } .accentsoft { fill: var(--accentsoft); } .warnsoft { fill: var(--warnsoft); } .bluesoft { fill: var(--bluesoft); }
.line { stroke: var(--line); } .sline { stroke: var(--muted); } .sgood { stroke: var(--good); } .sbad { stroke: var(--bad); } .saccent { stroke: var(--accent); } .swarn { stroke: var(--warn); }
.sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; } .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace; }
</style>

<rect x="0.5" y="0.5" width="1279" height="349" rx="18" class="card"/>
<text x="64" y="118" xml:space="preserve" class="ink sans" font-size="76" font-weight="700" text-anchor="start" letter-spacing="-2">frameproof</text>
<text x="68" y="162" xml:space="preserve" class="muted sans" font-size="24" font-weight="400" text-anchor="start">Frame-level performance evidence for web apps,</text>
<text x="68" y="194" xml:space="preserve" class="muted sans" font-size="24" font-weight="400" text-anchor="start">built to be used by coding agents.</text>
<g transform="translate(860 64)">
  <rect x="0" y="0" width="356" height="160" rx="14" class="card2"/>
  <text x="24" y="38" xml:space="preserve" class="muted sans" font-size="12" font-weight="600" text-anchor="start" letter-spacing="1.2">SCROLL DOWN · 4x CPU</text>
  <text x="24" y="98" xml:space="preserve" class="bad sans" font-size="54" font-weight="700" text-anchor="start">24</text>
  <text x="98" y="90" xml:space="preserve" class="faint sans" font-size="34" font-weight="400" text-anchor="start">→</text>
  <text x="140" y="98" xml:space="preserve" class="good sans" font-size="54" font-weight="700" text-anchor="start">0</text>
  <text x="184" y="78" xml:space="preserve" class="muted sans" font-size="15" font-weight="400" text-anchor="start">late frames a step,</text>
  <text x="184" y="98" xml:space="preserve" class="muted sans" font-size="15" font-weight="400" text-anchor="start">median of 32 runs</text>
  <rect x="24" y="116" width="301" height="24" rx="12" class="goodsoft"/><text x="174.5" y="132.32" xml:space="preserve" class="good sans" font-size="12" font-weight="600" text-anchor="middle">better · confirmed on fresh repetitions</text>
</g>
