<text x="640" y="31" xml:space="preserve" class="muted sans" font-size="13" font-weight="400" text-anchor="middle">your project — zsh</text><text x="40" y="96" xml:space="preserve" class="good mono" font-size="17" font-weight="700" text-anchor="start">$ </text><text x="62" y="96" xml:space="preserve" class="ink mono" font-size="17" font-weight="600" text-anchor="start">npx -y github:Felichz/FrameProof next</text><text x="40" y="124" xml:space="preserve" class="muted mono" font-size="16" font-weight="400" text-anchor="start">{</text><text x="40" y="152" xml:space="preserve" class="muted mono" font-size="16" font-weight="400" text-anchor="start"> "status": "ok",</text><text x="40" y="180" xml:space="preserve" class="muted mono" font-size="16" font-weight="400" text-anchor="start"> "summary": "this machine isn't calibrated for open-cart, load: find its</text><text x="40" y="208" xml:space="preserve" class="muted mono" font-size="16" font-weight="400" text-anchor="start">   noise floor and what it can see, once (about 15 minutes; --background</text><text x="40" y="236" xml:space="preserve" class="muted mono" font-size="16" font-weight="400" text-anchor="start">   to keep working)",</text><text x="40" y="264" xml:space="preserve" class="muted mono" font-size="16" font-weight="400" text-anchor="start"> "machine": "darwin-i5-1038ng7-8c-chrome156-95adeb",</text><rect x="32" y="272" width="1216" height="29" rx="7" class="bluesoft"/><rect x="32" y="272" width="4" height="29" rx="2" class="blue"/><text x="40" y="292" xml:space="preserve" class="blue mono" font-size="16" font-weight="650" text-anchor="start"> "next": ["frameproof calibrate -s open-cart,load --throttle 1,4 --background"]</text><text x="40" y="320" xml:space="preserve" class="muted mono" font-size="16" font-weight="400" text-anchor="start">}</text><text x="40" y="368" xml:space="preserve" class="faint sans" font-size="14" font-weight="400" text-anchor="start">next reads the project and the machine, and answers with the one thing to do now and its exact command.</text>
