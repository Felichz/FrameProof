<text x="640" y="30" xml:space="preserve" class="muted sans" font-size="13" font-weight="400" text-anchor="middle">your project</text><text x="40" y="92" xml:space="preserve" class="good mono" font-size="17" font-weight="700" text-anchor="start">$ </text><text x="64" y="92" xml:space="preserve" class="ink mono" font-size="17" font-weight="600" text-anchor="start">npx -y github:Felichz/FrameProof next</text><text x="40" y="120" xml:space="preserve" class="muted mono" font-size="16" font-weight="400" text-anchor="start">{</text><text x="40" y="148" xml:space="preserve" class="muted mono" font-size="16" font-weight="400" text-anchor="start"> "status": "ok",</text><text x="40" y="176" xml:space="preserve" class="muted mono" font-size="16" font-weight="400" text-anchor="start"> "summary": "this machine isn't calibrated for open-cart, load: find its</text><text x="40" y="204" xml:space="preserve" class="muted mono" font-size="16" font-weight="400" text-anchor="start">   noise floor and what it can see, once (about 15 minutes; --background</text><text x="40" y="232" xml:space="preserve" class="muted mono" font-size="16" font-weight="400" text-anchor="start">   to keep working)",</text><text x="40" y="260" xml:space="preserve" class="muted mono" font-size="16" font-weight="400" text-anchor="start"> "machine": "darwin-i5-1038ng7-8c-chrome156-95adeb",</text><rect x="34" y="268" width="1212" height="28" rx="6" class="bluesoft"/><text x="40" y="288" xml:space="preserve" class="blue mono" font-size="16" font-weight="600" text-anchor="start"> "next": ["frameproof calibrate -s open-cart,load --throttle 1,4 --background"]</text><text x="40" y="316" xml:space="preserve" class="muted mono" font-size="16" font-weight="400" text-anchor="start">}</text><text x="40" y="362" xml:space="preserve" class="faint sans" font-size="14" font-weight="400" text-anchor="start">`next` reads the project and the machine and says the one thing to do now, with its exact command.</text>
