<text x="232" y="411" xml:space="preserve" class="muted sans" font-size="15" font-weight="400" text-anchor="start">a sorted copy of the catalog and a JSON snapshot: they look costly, measure as nothing, and were not blamed</text><text x="48" y="458" xml:space="preserve" class="faint sans" font-size="13" font-weight="400" text-anchor="start">Cost bars on a log scale. freezes names what held a frame; journey covers setups and gaps no step measures; check + query count work at rest.</text>
